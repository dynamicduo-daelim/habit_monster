spring.application.name=habit-monster-server

# 모든 API는 /api/v1 아래 (API 명세 v4). 앱의 API_BASE_URL도 http://<서버>:8080/api/v1
server.servlet.context-path=/api/v1

# 업무 날짜: Asia/Seoul 00시 경계 (common/BusinessDates)
app.business.zone=Asia/Seoul
app.business.day-boundary-hour=0

# PostgreSQL — 스키마는 공유 폴더의 schema.sql(v1.6) + seed.sql 로 만든다 (JPA가 테이블을 만들거나 바꾸지 않음)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/habit_monster}
spring.datasource.username=${DB_USER:habit}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# 인증 — 비밀값은 환경변수로 (코드 · 깃에 넣지 않기)
app.auth.jwt-secret=${JWT_SECRET}
app.auth.issuer=habit-monster
app.auth.access-token-ttl=30m
app.auth.refresh-token-ttl=30d
app.auth.kakao.app-id=${KAKAO_APP_ID:}
app.auth.google.client-ids=${GOOGLE_CLIENT_IDS:}

# 브라우저(Flutter 웹)에서 부를 수 있는 출처, 쉼표로 여러 개. 기본은 비어 있어 꺼짐 (config/CorsConfig, 결정 D-44)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# AI 챗봇 (Gemini) — 키는 backend/.env의 GEMINI_API_KEY (커밋 금지). 키가 비면 AI를 끄고 대본형으로 (결정 D-57)
# backend/.env를 설정으로 읽는다 (없으면 넘어감). 서버는 backend/server 에서 실행하므로 ../.env
spring.config.import=optional:file:../.env[.properties]
app.llm.gemini.api-key=${GEMINI_API_KEY:}
app.llm.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
# 응답 제한 시간 · 하루 호출 한도 · 다시 묻는 확신 기준 [가정] — DB 설정값(ai_*)으로 옮기는 것은 DB 제안 5번
app.llm.timeout-ms=3000
app.llm.daily-call-limit=60
app.llm.min-confidence=0.6
