# 로컬 실행용 프로필: Docker DB(localhost:5435)에 붙는다. 먼저 backend/ 에서 docker compose up -d
#   ./gradlew bootRun --args='--spring.profiles.active=local'
# 스키마 · 시드는 Docker DB가 공식 schema.sql · seed.sql로 만든다 (JPA는 테이블을 만들지 않음, ddl-auto=none).
# 테스트는 이 프로필을 쓰지 않는다 (Testcontainers, support/PostgresTest).
spring.datasource.url=jdbc:postgresql://localhost:5435/habit_monster
spring.datasource.username=habit
spring.datasource.password=habit

# 로컬 전용 키 — 운영에서는 반드시 JWT_SECRET 환경변수
app.auth.jwt-secret=local-dev-secret-change-me-0123456789abcdef

# 소셜 로그인 확인용 공개 값 (카카오 앱 ID, 구글 웹 · Android 클라이언트 ID)
app.auth.kakao.app-id=1600125
